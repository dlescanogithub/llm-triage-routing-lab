name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: lint
        run: python -m ruff check . && python -m ruff format --check .
      - name: types
        run: python -m mypy src
      - name: tests
        run: python -m pytest
      - name: eval gate
        run: python -m triage_lab eval
      - name: forced regression must fail
        run: |
          if python -m triage_lab eval --regression; then
            echo "regression gate should exit 1"
            exit 1
          fi
      - name: secret scan
        run: python -m triage_lab.secretscan
